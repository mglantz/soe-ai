---
# Boot parameter changes only take effect on next boot, and a bad edit to
# GRUB_CMDLINE_LINUX can leave a host unbootable or without console access.
# This role deliberately only *audits* the kernel command line — actually
# changing it is a manual, reviewed step (see this role's SKILL.md).

- name: Read current GRUB_CMDLINE_LINUX
  ansible.builtin.command: grep '^GRUB_CMDLINE_LINUX=' {{ soe_boot_grub_default }}
  register: soe_boot_grub_line
  changed_when: false
  check_mode: false
  tags: [boot_parameters]

- name: Assert no forbidden boot parameters are present
  ansible.builtin.assert:
    that: item not in soe_boot_grub_line.stdout
    fail_msg: >-
      Forbidden boot parameter present on the kernel cmdline: {{ item }}.
      Remove it from GRUB_CMDLINE_LINUX in {{ soe_boot_grub_default }}, run
      grub2-mkconfig, and reboot.
  loop: "{{ soe_boot_forbidden_params }}"
  tags: [boot_parameters]

- name: Assert required boot parameters are present
  ansible.builtin.assert:
    that: item in soe_boot_grub_line.stdout
    fail_msg: "Required boot parameter missing: {{ item }}. Add it to GRUB_CMDLINE_LINUX in {{ soe_boot_grub_default }}, run grub2-mkconfig, and reboot."
  loop: "{{ soe_boot_required_params }}"
  tags: [boot_parameters]
